<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Private Companion · Dashboard</title>
    <style>
      :root {
        --bg: #0f1115;
        --card: #171a21;
        --line: #262b36;
        --text: #e7e9ee;
        --muted: #8b93a7;
        --green: #3ddc84;
        --amber: #ffb020;
        --blue: #4da3ff;
        --red: #ff5d5d;
        --grey: #5b6275;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, "Segoe UI", sans-serif;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 14px;
        margin: 18px 0 14px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
      }
      .label {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 8px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 22px;
        font-weight: 600;
      }
      .dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--grey);
        flex: none;
      }
      .pulse {
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      .big {
        font-size: 30px;
        font-weight: 700;
      }
      .text {
        font-size: 16px;
        line-height: 1.5;
        min-height: 24px;
      }
      .pill {
        display: inline-block;
        margin-top: 12px;
        padding: 4px 12px;
        border-radius: 999px;
        background: var(--line);
        font-size: 13px;
      }
      .bar {
        height: 8px;
        background: var(--line);
        border-radius: 4px;
        overflow: hidden;
        margin-top: 6px;
      }
      .bar > div {
        height: 100%;
        width: 0;
        transition: width 0.3s;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        text-align: left;
        padding: 8px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      th {
        color: var(--muted);
        font-weight: 500;
      }
      .ok {
        color: var(--green);
      }
      .failed {
        color: var(--amber);
      }
      .blocked {
        color: var(--red);
      }
      .sos {
        display: none;
        border-radius: 14px;
        padding: 20px;
        margin: 18px 0;
        background: #b3261e;
        color: #fff;
      }
      .sos.calm {
        background: #2d4a7a;
      }
      .sos-title {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 10px;
      }
      .sos-line {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 20px;
        padding: 4px 0;
      }
      .sos-num {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 2px;
      }
      .sos.aid {
        background: #1f6f5c;
      }
      .sos-text {
        font-size: 18px;
        line-height: 1.5;
        margin-bottom: 8px;
      }
      .sos-note {
        font-size: 13px;
        opacity: 0.8;
        margin-top: 8px;
      }
      .act {
        display: none;
        border-color: #1f6f5c;
        margin: 18px 0;
        text-align: center;
      }
      .act-title {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .act-line {
        font-size: 24px;
        padding: 2px 0;
      }
      .timer {
        display: none;
        font-size: 72px;
        font-weight: 800;
        letter-spacing: 3px;
        margin: 10px 0 4px;
        font-variant-numeric: tabular-nums;
      }
      .breath {
        display: none;
        width: 170px;
        height: 170px;
        margin: 18px auto 6px;
        border-radius: 50%;
        background: radial-gradient(circle, #a8e6d5, #1f6f5c);
        transform: scale(0.55);
        transition: transform 4s ease-in-out;
      }
      .hug {
        display: none;
        justify-content: center;
        margin: 10px auto 0;
      }
      .hug svg {
        width: 240px;
        height: 190px;
      }
      .side {
        transform-box: view-box;
        transform-origin: 100px 85px; /* wings fold in towards the body */
        animation: flap 2.4s ease-in-out infinite;
      }
      .side.right {
        animation-delay: -1.2s; /* right side taps half a beat after the left */
      }
      @keyframes flap {
        0%,
        50%,
        100% {
          transform: scaleX(1);
          filter: brightness(1);
        }
        25% {
          transform: scaleX(0.55);
          filter: brightness(1.35);
        }
      }
      .hug-caption {
        display: none;
        font-size: 22px;
        letter-spacing: 0.1em;
        color: var(--muted);
      }
      .hug-caption span {
        animation: glow 2.4s ease-in-out infinite;
      }
      .hug-caption .tap-r {
        animation-delay: -1.2s;
      }
      @keyframes glow {
        0%,
        50%,
        100% {
          color: var(--muted);
        }
        25% {
          color: #f7c6e0;
        }
      }
      .timer {
        display: none;
        font-size: 72px;
        font-weight: 800;
        letter-spacing: 3px;
        margin: 10px 0 4px;
        font-variant-numeric: tabular-nums;
      }
      .orbs {
        display: none;
        justify-content: center;
        gap: 22px;
        margin: 18px 0 8px;
      }
      .orb {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        opacity: 0.3;
        transition:
          opacity 0.15s,
          transform 0.15s,
          box-shadow 0.15s;
      }
      .orb.lit {
        opacity: 1;
        transform: scale(1.18);
        box-shadow: 0 0 36px currentColor;
      }
    </style>
  </head>
  <body>
    <h1>🔒 Private Companion</h1>
    <div class="sub">
      All reasoning happens on this device. Only the calls listed below ever
      touched the internet.
    </div>
    <div id="sos" class="sos">
      <div class="sos-title" id="sos-title"></div>
      <div id="sos-lines"></div>
    </div>
    <div id="act" class="card act">
      <div class="act-title" id="act-title"></div>
      <div id="act-lines"></div>
      <div id="timer" class="timer"></div>
      <div id="orbs" class="orbs"></div>
      <div id="breath" class="breath"></div>
      <div id="hug" class="hug">
        <svg
          viewBox="0 0 200 160"
          aria-label="Butterfly tapping left and right"
        >
          <defs>
            <linearGradient id="upperWing" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#f7c6e0" />
              <stop offset="100%" stop-color="#a78bfa" />
            </linearGradient>
            <linearGradient id="lowerWing" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#c4b5fd" />
              <stop offset="100%" stop-color="#7c5cc4" />
            </linearGradient>
            <g id="wings">
              <path
                d="M100 72 C 72 20, 22 8, 14 42 C 8 72, 58 86, 100 80 Z"
                fill="url(#upperWing)"
              />
              <path
                d="M100 84 C 66 86, 34 108, 48 134 C 62 152, 92 122, 100 92 Z"
                fill="url(#lowerWing)"
              />
              <circle cx="45" cy="45" r="9" fill="#fff" opacity="0.45" />
              <circle cx="66" cy="62" r="5" fill="#fff" opacity="0.35" />
              <circle cx="64" cy="118" r="6" fill="#fff" opacity="0.35" />
            </g>
          </defs>
          <g class="side left"><use href="#wings" /></g>
          <g class="side right">
            <g transform="translate(200 0) scale(-1 1)">
              <use href="#wings" />
            </g>
          </g>
          <!-- body, head and antennae stay still -->
          <ellipse cx="100" cy="88" rx="5" ry="34" fill="#5b3f8c" />
          <circle cx="100" cy="51" r="7" fill="#5b3f8c" />
          <path
            d="M97 46 Q 88 26 78 20"
            stroke="#5b3f8c"
            stroke-width="2.5"
            fill="none"
            stroke-linecap="round"
          />
          <path
            d="M103 46 Q 112 26 122 20"
            stroke="#5b3f8c"
            stroke-width="2.5"
            fill="none"
            stroke-linecap="round"
          />
          <circle cx="78" cy="20" r="3.5" fill="#5b3f8c" />
          <circle cx="122" cy="20" r="3.5" fill="#5b3f8c" />
        </svg>
      </div>
      <div id="hug-caption" class="hug-caption">
        <span class="tap-l">left</span> · <span class="tap-r">right</span>
      </div>
    </div>
    <div class="grid">
      <div class="card">
        <div class="label">Device</div>
        <div class="status">
          <span id="dot" class="dot"></span><span id="status">…</span>
        </div>
      </div>
      <div class="card">
        <div class="label">Saved memories (on device)</div>
        <div class="big" id="memories">–</div>
      </div>
      <div class="card">
        <div class="label">Internet calls</div>
        <div class="big" id="calls">–</div>
        <div class="sub" id="callsub"></div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="label">Last heard</div>
        <div class="text" id="heard">—</div>
      </div>
      <div class="card">
        <div class="label">Answer</div>
        <div class="text" id="reply">—</div>
        <span class="pill" id="route">—</span>
        <div id="confwrap" style="display: none; margin-top: 14px">
          <div class="label">Model confidence: <span id="conf"></span></div>
          <div class="bar"><div id="confbar"></div></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="label">Internet log (newest first)</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Tool</th>
              <th>What left the device</th>
              <th>Where</th>
              <th>Result</th>
            </tr>
          </thead>
          <tbody id="log"></tbody>
        </table>
      </div>
    </div>

    <script>
      const COLORS = {
        waiting: "var(--grey)",
        listening: "var(--green)",
        thinking: "var(--amber)",
        speaking: "var(--blue)",
        starting: "var(--grey)",
      };
      const LABELS = {
        waiting: "Waiting for wake word",
        listening: "Listening",
        thinking: "Thinking (on this device)",
        speaking: "Speaking",
        starting: "Starting…",
      };
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c],
        );
      const $ = (id) => document.getElementById(id);

      let lastBreath = null;
      const ORB = {
        red: "#ef4444",
        blue: "#3b82f6",
        green: "#22c55e",
        yellow: "#eab308",
      };
      async function tick() {
        try {
          const s = await (await fetch("/state")).json();
          $("dot").style.background = COLORS[s.status] || "var(--grey)";
          $("dot").classList.toggle(
            "pulse",
            s.status === "listening" || s.status === "thinking",
          );
          $("status").textContent = LABELS[s.status] || s.status;
          $("memories").textContent = s.memories;
          const e = s.emergency;
          $("sos").style.display = e ? "block" : "none";
          if (e) {
            $("sos").className =
              "sos" +
              (e.kind === "crisis"
                ? " calm"
                : e.kind === "first_aid"
                  ? " aid"
                  : "");
            $("sos-title").textContent = e.title;
            $("sos-lines").innerHTML =
              (e.text ? `<div class="sos-text">${esc(e.text)}</div>` : "") +
              (e.lines || [])
                .map(
                  (l) =>
                    `<div class="sos-line"><span>${esc(l[0])}</span><span class="sos-num">${esc(l[1])}</span></div>`,
                )
                .join("") +
              (e.note ? `<div class="sos-note">${esc(e.note)}</div>` : "");
          }
          const a =
            s.activity &&
            !(s.activity.expires && s.activity.expires < Date.now() / 1000)
              ? s.activity
              : null;
          $("act").style.display = a ? "block" : "none";
          if (a) {
            $("act-title").textContent = a.title;
            $("act-lines").innerHTML = (a.lines || [])
              .map((l) => `<div class="act-line">${esc(l)}</div>`)
              .join("");
          }
          const tm = a && a.timer;
          $("timer").style.display = tm ? "block" : "none";
          if (tm) {
            const left =
              tm.left != null
                ? tm.left
                : Math.max(0, tm.ends - Date.now() / 1000);
            $("timer").textContent =
              `${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, "0")}`;
          }
          const orbs = a && a.orbs;
          $("orbs").style.display = orbs ? "flex" : "none";
          if (orbs) {
            $("orbs").innerHTML = orbs
              .map(
                (c) =>
                  `<div class="orb${a.flash === c ? " lit" : ""}" style="background:${ORB[c]};color:${ORB[c]}"></div>`,
              )
              .join("");
          }
          const b = a && a.breath;
          $("breath").style.display = b ? "block" : "none";
          if (b && b.id !== lastBreath) {
            lastBreath = b.id;
            $("breath").style.transitionDuration = b.seconds + "s";
            if (b.phase === "in") $("breath").style.transform = "scale(1)";
            if (b.phase === "out") $("breath").style.transform = "scale(0.55)";
          }
          const hug = a && a.anim === "butterfly";
          $("hug").style.display = hug ? "flex" : "none";
          $("hug-caption").style.display = hug ? "block" : "none";
          $("heard").textContent = s.last_heard || "—";
          $("reply").textContent = s.last_reply || "—";
          $("route").textContent = s.route || "—";

          if (s.confidence != null) {
            $("confwrap").style.display = "block";
            $("conf").textContent = s.confidence.toFixed(2);
            $("confbar").style.width = s.confidence * 100 + "%";
            $("confbar").style.background =
              s.confidence >= 0.85 ? "var(--green)" : "var(--amber)";
          } else {
            $("confwrap").style.display = "none";
          }

          const t = s.totals || {};
          const total = (t.ok || 0) + (t.failed || 0) + (t.blocked || 0);
          $("calls").textContent = total;
          $("callsub").textContent =
            `${t.ok || 0} ok · ${t.failed || 0} failed · ${t.blocked || 0} blocked`;

          $("log").innerHTML =
            s.log
              .map(
                (e) => `<tr>
          <td>${esc((e.time || "").slice(11))}</td>
          <td>${esc(e.tool)}</td>
          <td>${e.sent != null ? esc(e.sent) : "nothing sent (tried: " + esc(e.attempted) + ")"}</td>
          <td>${esc(e.host || "—")}</td>
          <td class="${esc(e.status || "ok")}">${esc(e.status || "ok")}</td>
        </tr>`,
              )
              .join("") ||
            `<tr><td colspan="5" class="sub">No internet calls yet.</td></tr>`;
        } catch (err) {
          $("status").textContent = "Device offline";
          $("dot").style.background = "var(--red)";
        }
      }
      setInterval(tick, 300);
      tick();
    </script>
  </body>
</html>
